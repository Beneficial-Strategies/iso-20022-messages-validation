name: CI

# feature/full-coverage is the integration branch of the work on full coverage (#19): its pull requests are checked like those into main.
on:
  push:
    branches: [main, feature/full-coverage]
  pull_request:
    branches: [main, feature/full-coverage]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # One .NET 10 SDK builds every target framework; the SDK fetches the reference packs of the older ones.
      # TreatWarningsAsErrors is set in Directory.Build.props, so this step is also the zero-warnings gate.
      - name: Build (every target framework, zero warnings)
        run: dotnet build -c Release

      - name: Test (net8.0 and net10.0)
        run: dotnet test -c Release --no-build

      - name: Build and run the examples against the packed package
        run: tools/run-examples.sh

      - name: The README matches the examples
        run: python3 tools/sync-readme.py --check

      - name: The packed README renders on nuget.org, and the changelog has an entry for this version
        run: python3 tools/package/prepare_package_files.py --check

      - name: Check the licenses of the packages we depend on
        run: tools/licenses/check.sh

      # The coverage scripts read the model from the two repositories it comes from. They are cloned here, and the
      # script must find an IsoId for the type of every validator: a folder that moves in either fails this step.
      - uses: actions/checkout@v4
        with:
          repository: Beneficial-Strategies/iso-20022-messages
          path: _models/iso-20022-messages
      - uses: actions/checkout@v4
        with:
          repository: Beneficial-Strategies/iso-20022-primitives
          path: _models/iso-20022-primitives

      - name: The coverage scripts find the model and the validators
        run: |
          python3 -m unittest -q test_coverage_scripts
          python3 build_coverage_checksums.py /dev/null --strict --out "$RUNNER_TEMP/coverage-checksums.json"
        working-directory: src/Validation/tools
        env:
          ISO20022_MESSAGES_REPO: ${{ github.workspace }}/_models/iso-20022-messages
          ISO20022_PRIMITIVES_REPO: ${{ github.workspace }}/_models/iso-20022-primitives

      - name: Test the release and package tooling
        run: |
          python3 -m unittest -q test_prepare_release
          python3 -m unittest -q test_prepare_package_files
        working-directory: tools/releasing
        env:
          PYTHONPATH: ../package

  # The netstandard2.0 build of the validators is for .NET Framework (4.6.1 and later), Mono and Unity. Its tests run on .NET Framework 4.8,
  # which needs Windows. The tests project adds net48 to its target frameworks on Windows.
  netstandard-net48:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The netstandard2.0 build, with classes of the tests' own (no records: they are net8.0 and net10.0 only).
      - name: Test the validators on .NET Framework 4.8
        run: dotnet test tests/Validation.NetStandard.Tests -c Release -f net48
